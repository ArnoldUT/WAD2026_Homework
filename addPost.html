<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PostIt - Create post</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- Header + Navigation bar -->
    <header>
      <nav class="navbar">
        <!-- Navigation links -->
        <a href="index.html" class="nav-item">Home</a>
        <a href="addPost.html" class="nav-item">Add Post</a>

        <div class="profile-menu">
          <button type="button" class="profile-trigger" id="profile-trigger" aria-label="Open profile menu" aria-expanded="false" aria-controls="profile-dropdown">
            <img src="images/profile.png" alt="" class="nav-profile" />
          </button>
          <div class="profile-dropdown" id="profile-dropdown" hidden>
            <p class="profile-name" id="profile-name"></p>
            <p class="profile-email" id="profile-email"></p>
            <button type="button" class="profile-action" id="profile-action"></button>
          </div>
        </div>
      </nav>
    </header>

    <!-- Add post content -->
    <main>
      <article class="create-post-card">
        <form id="post-form">
          <div class="form-row">
            <label for="post-body">Post body</label>
            <textarea
              id="post-body"
              name="post-body"
              placeholder="Write your post..."
              required
            ></textarea>
          </div>

          <div class="form-row image-upload-field">
            <label for="file-upload">Select file</label>
            <label for="file-upload" class="upload-file-button">
              Choose File
            </label>
            <input
              type="file"
              id="file-upload"
              name="file-upload"
              class="hidden-file-input"
              accept="image/*"
            />
          </div>

          <button type="submit" class="post-submit">Create post</button>
        </form>
      </article>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; Made by Team BC — Homework</p>
    </footer>

    <script src="js/addPost.js"></script>
    <script src="js/profile-menu.js"></script>
  </body>
</html>
