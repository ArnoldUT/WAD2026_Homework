<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PostIt – Home</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- Header + Navigation bar -->
    <header>
      <nav class="navbar">
        <!-- Navigation links -->
        <a href="index.html" class="nav-item">Home</a>
        <a href="addPost.html" class="nav-item">Add Post</a>

        <div class="profile-menu">
          <button type="button" class="profile-trigger" id="profile-trigger" aria-label="Open profile menu" aria-expanded="false" aria-controls="profile-dropdown">
            <img src="images/profile.png" alt="" class="nav-profile" />
          </button>
          <div class="profile-dropdown" id="profile-dropdown" hidden>
            <p class="profile-name" id="profile-name"></p>
            <p class="profile-email" id="profile-email"></p>
            <button type="button" class="profile-action" id="profile-action"></button>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main content area -->
    <main>
      <h1>All Posts</h1>

      <div id="posts-container"></div>
    </main>

    <!-- Online API version (MockAPI) -->
    <!-- <script src="js/script-api.js"></script> -->

    <!-- Local JSON version -->
    <!-- Open the project with VS Code Live Server to allow Fetch API access to local JSON files. -->
    <script src="js/script-local.js"></script>
    <script src="js/profile-menu.js"></script>
    <!-- JSON Validator used: https://jsonlint.com/ -->
    <!-- Footer -->
    <footer>
      <p>&copy; Made by Team BC — Homework</p>
    </footer>
  </body>
</html>
