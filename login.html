<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PostIt - Log In</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- Header + Navigation -->
    <header>
      <nav class="navbar">
        <a href="index.html" class="nav-item">Home</a>
        <a href="addPost.html" class="nav-item">Add Post</a>

        <div class="profile-menu">
          <button type="button" class="profile-trigger" id="profile-trigger" aria-label="Open profile menu" aria-expanded="false" aria-controls="profile-dropdown">
            <img src="images/profile.png" alt="" class="nav-profile" />
          </button>
          <div class="profile-dropdown" id="profile-dropdown" hidden>
            <p class="profile-name" id="profile-name"></p>
            <p class="profile-email" id="profile-email"></p>
            <button type="button" class="profile-action" id="profile-action"></button>
          </div>
        </div>
      </nav>
    </header>

    <!-- Main login content -->
    <main>
      <article class="login-card">
        <h1>Welcome to PostIt</h1>

        <a href="#" class="account-link">Create an account</a>

        <p class="login-or">or</p>
        <p class="login-prompt">Please log in</p>

        <form id="login-form">
          <div class="form-field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Email"
              autocomplete="email"
              required
            />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Password"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit">Log in</button>
        </form>

        <a href="#" class="forgot-link">Forget password</a>
      </article>
    </main>

    <!-- Footer -->
    <footer>
      <p>&copy; Made by Team BC — Homework</p>
    </footer>
    <script src="js/login.js"></script>
    <script src="js/profile-menu.js"></script>
  </body>
</html>
